name: CI — Africa Scout Pulse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  supabase-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SQL migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Checking $f..."
            # Basic validation: must contain at least one SQL statement
            if ! grep -qE '(CREATE|ALTER|INSERT|UPDATE|DELETE|DROP)' "$f"; then
              echo "ERROR: $f contains no valid SQL statements"
              exit 1
            fi
          done